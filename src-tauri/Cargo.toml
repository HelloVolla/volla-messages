[package]
name = "volla_messages"
version = "0.12.2"
description = "Volla Messages"
authors = ["Tibet Sprague", "Eric Harris-Braun"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.2.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.5.1", features = ["devtools"] }
tauri-runtime = {version = "2.6.0", optional = true}
tauri-plugin-holochain = { path = "../../tauri-plugin-holochain/crates/tauri-plugin-holochain", optional = true }
tauri-plugin-holochain-service-client = { git = "https://github.com/HelloVolla/volla-cloud-services", tag = "android-service-runtime-v0.3.2" , optional = true }

# iroh + reticulum. The reticulum backend (LXMF-rs vs Beechat) is selected
# by the `reticulum-lxmf` / `reticulum-beechat` features of this crate;
# enabling neither will fail to compile because `ReticulumTransportConfig`
# is imported unconditionally by the bundled builder.
holochain = {version = "0.6.1-rc.7", default-features = false, features = ["sqlite-encrypted", "wasmer_sys", "transport-iroh"] }

# go-pion webrtc back-end
#holochain = {version = "0.6.0", default-features = false, features = ["sqlite-encrypted", "wasmer_sys", "backend-go-pion"] }

holochain_types = "0.6.1-rc.7"
lair_keystore = "0.6.3"
holochain_client = "0.8.1-rc.7"

log = "0.4"
tauri-plugin-log = "2.4.0"
tauri-plugin-notification = "2.2.2"
tauri-plugin-clipboard-manager = "2.2.2"
tauri-plugin-sharesheet = "0.0.1"
tauri-plugin-shell = "2.2.1"
tauri-plugin-barcode-scanner = "2.2.0"
tauri-plugin-os = "2.2.1"
tauri-plugin-fs = "2.2.1"
tauri-plugin-dialog = "2.2.1"
url2 = "0.0.6"
app_dirs2 = "2.5.5"
tempdir = "0.3.7"
anyhow = "1"
serde_json = "1"
uuid = { version = "1.12.0", features = ["v4", "fast-rng"] }
base64ct = "=1.7.3"

[features]
default = []

holochain_bundled = ["dep:tauri-plugin-holochain", "dep:tauri-runtime"]
holochain_service = ["dep:tauri-plugin-holochain-service-client"]

# Reticulum backend selection. Exactly one of these must be enabled for
# desktop builds — the `kitsune2_transport_reticulum` crate has a
# compile-time check that the two are mutually exclusive, and the bundled
# builder imports `ReticulumTransportConfig` unconditionally.
#
# `reticulum-beechat` additionally requires the kitsune2-lrl checkout to
# be on the `transport-reticulum-chunking` branch (which provides the
# Beechat path dep and the chunking layer the backend needs).
reticulum-lxmf    = ["holochain/transport-reticulum"]
reticulum-beechat = ["holochain/transport-reticulum-beechat"]

# Redirect holochain + kitsune2 to local sibling checkouts on the
# transport-reticulum branches. Re-targets the entire holochain stack
# to kitsune2-lrl 0.5.0-dev.0 so the `transport-reticulum` feature
# compiles end-to-end.
[patch.crates-io]
holochain              = { path = "../../holochain-lrl/crates/holochain" }
holochain_types        = { path = "../../holochain-lrl/crates/holochain_types" }
holochain_client       = { path = "../../holochain-lrl/crates/client" }
holochain_conductor_api = { path = "../../holochain-lrl/crates/holochain_conductor_api" }
holochain_keystore     = { path = "../../holochain-lrl/crates/holochain_keystore" }
holochain_util         = { path = "../../holochain-lrl/crates/holochain_util" }
holochain_state        = { path = "../../holochain-lrl/crates/holochain_state" }
holochain_sqlite       = { path = "../../holochain-lrl/crates/holochain_sqlite" }
holochain_p2p          = { path = "../../holochain-lrl/crates/holochain_p2p" }
holochain_cascade      = { path = "../../holochain-lrl/crates/holochain_cascade" }
holo_hash              = { path = "../../holochain-lrl/crates/holo_hash" }
mr_bundle              = { path = "../../holochain-lrl/crates/mr_bundle" }

kitsune2                   = { path = "../../kitsune2-lrl/crates/kitsune2" }
kitsune2_api               = { path = "../../kitsune2-lrl/crates/api" }
kitsune2_core              = { path = "../../kitsune2-lrl/crates/core" }
kitsune2_dht               = { path = "../../kitsune2-lrl/crates/dht" }
kitsune2_gossip            = { path = "../../kitsune2-lrl/crates/gossip" }
kitsune2_bootstrap_srv     = { path = "../../kitsune2-lrl/crates/bootstrap_srv" }
kitsune2_bootstrap_client  = { path = "../../kitsune2-lrl/crates/bootstrap_client" }
kitsune2_test_utils        = { path = "../../kitsune2-lrl/crates/test_utils" }
kitsune2_transport_tx5     = { path = "../../kitsune2-lrl/crates/transport_tx5" }
kitsune2_transport_iroh    = { path = "../../kitsune2-lrl/crates/transport_iroh" }
kitsune2_transport_reticulum = { path = "../../kitsune2-lrl/crates/transport_reticulum" }

# rusqlite 0.37 + UDP multicast fork of reticulum-rs-transport.
reticulum-rs-transport = { git = "https://github.com/lightningrodlabs/LXMF-rs", branch = "udp-multicast" }

# Inherited from volla workspace root — kept here because src-tauri is excluded from that workspace.
wasmer-vm   = { git = "https://github.com/guillemcordoba/wasmer", branch = "fix-x86" }
wasmer-types = { git = "https://github.com/guillemcordoba/wasmer", branch = "fix-x86" }
