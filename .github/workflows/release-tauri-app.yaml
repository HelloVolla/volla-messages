name: "release-tauri-app"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[a-z]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[a-z]+.[0-9]+'
env:
  CARGO_REGISTRIES_CARGO_HOSTED_TOKEN: ${{ secrets.VOLLA_NEXUS_TOKEN }}

jobs:
  create-release:
    permissions: write-all
    environment: Relay Release
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.step1.outputs.id }}
    steps:
      - id: step1
        uses: ncipollo/release-action@v1
        with:
          name: "Volla Messages ${{ github.ref_name }}"
          body: |
            See the assets to download this version and install.

            Android builds are distinguished as either 'rich' or 'lite':
            - The 'rich' build includes a bundled holochain conductor. It can be used on any Android device.
            - The 'lite' build relies on the holochain conductor provided by the [Android Service Runtime app](https://github.com/holochain/android-service-runtime),. The Android Service Runtime app can be installed on any Android device, and will be preinstalled with Volla OS.
          prerelease: true
          draft: true

  release-tauri-app-linux:
    needs: create-release
    permissions: write-all
    environment: Relay Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: [self-hosted, yolo]
            target: x86_64-unknown-linux-gnu
            container: ubuntu:22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: null
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v3

      - name: Install packages (container only)
        if: matrix.container != null
        run: |
          apt-get update
          apt-get install -y sudo build-essential curl openjdk-11-jdk unzip git cmake clang libclang-dev

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update

          # Install ARM cross-compilation toolchain and libraries for armv7
          if [ "${{ matrix.arch }}" = "armv7" ]; then
              # Add armhf architecture
              sudo dpkg --add-architecture armhf

              # Restrict default sources.list to only amd64 architecture
              sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
              sudo sed -i 's/^deb-src /deb-src [arch=amd64] /g' /etc/apt/sources.list

              # Add ARM ports repository for armhf packages
              echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/armhf.list
              echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
              echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
              echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list

              sudo apt-get update

              # Install cross-compilation toolchain
              sudo apt-get install -y \
                gcc-arm-linux-gnueabihf \
                g++-arm-linux-gnueabihf \
                pkg-config \
                build-essential \
                curl \
                wget \
                file

              # Install ARM libraries for cross-compilation
              sudo apt-get install -y \
                libwebkit2gtk-4.1-dev:armhf \
                libsoup-3.0-dev:armhf \
                libssl-dev:armhf \
                libayatana-appindicator3-dev:armhf \
                librsvg2-dev:armhf \
                libxdo-dev:armhf \
                libgtk-3-dev:armhf \
                libgcc-11-dev:armhf \
                libunwind-dev:armhf
          else
              # Standard dependencies for native builds
              sudo apt-get install -y \
                libsoup-3.0-dev \
                libwebkit2gtk-4.1-dev \
                build-essential \
                curl \
                wget \
                file \
                libxdo-dev \
                libssl-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                pkg-config
          fi

          # We must pin webkitgtk to 2.44 for x86_64, as we get a blank screen on later versions.
          # See https://github.com/tauri-apps/tauri/issues/12431
          # Because libwebkit2gtk-4.1-dev version 2.46 has been removed from the apt repositories,
          # we must manually download the deb packages from launchpad to install it.
          # Only pin WebKitGTK on amd64 as these are arch-specific deb packages
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
              mkdir -p /tmp/ubuntu-packages
              cd /tmp/ubuntu-packages
              wget https://launchpadlibrarian.net/723972773/libwebkit2gtk-4.1-0_2.44.0-0ubuntu0.22.04.1_amd64.deb
              wget https://launchpadlibrarian.net/723972761/libwebkit2gtk-4.1-dev_2.44.0-0ubuntu0.22.04.1_amd64.deb
              wget https://launchpadlibrarian.net/723972770/libjavascriptcoregtk-4.1-0_2.44.0-0ubuntu0.22.04.1_amd64.deb
              wget https://launchpadlibrarian.net/723972746/libjavascriptcoregtk-4.1-dev_2.44.0-0ubuntu0.22.04.1_amd64.deb
              wget https://launchpadlibrarian.net/723972735/gir1.2-javascriptcoregtk-4.1_2.44.0-0ubuntu0.22.04.1_amd64.deb
              wget https://launchpadlibrarian.net/723972739/gir1.2-webkit2-4.1_2.44.0-0ubuntu0.22.04.1_amd64.deb
              wget https://launchpadlibrarian.net/606433947/libicu70_70.1-2ubuntu1_amd64.deb
              wget https://launchpadlibrarian.net/606433941/libicu-dev_70.1-2ubuntu1_amd64.deb
              wget https://launchpadlibrarian.net/606433945/icu-devtools_70.1-2ubuntu1_amd64.deb
              wget https://launchpadlibrarian.net/595623693/libjpeg8_8c-2ubuntu10_amd64.deb
              wget https://launchpadlibrarian.net/587202140/libjpeg-turbo8_2.1.2-0ubuntu1_amd64.deb
              wget https://launchpadlibrarian.net/592959859/xdg-desktop-portal-gtk_1.14.0-1build1_amd64.deb
              sudo apt-get install -y --allow-downgrades /tmp/ubuntu-packages/*.deb
          fi

      - name: Install and prepare
        run: |
          npm install
          npm run setup:happ-release

      - name: Copy variant tauri config
        run: |
          cp -f src-tauri/tauri.desktop.conf.json src-tauri/tauri.conf.json

      - name: Set up cross-compilation environment for armv7
        if: matrix.arch == 'armv7'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV

          # Add library search paths and link libraries via RUSTFLAGS
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS=-L/usr/lib/gcc-cross/arm-linux-gnueabihf/11 -C link-arg=-Wl,--start-group -C link-arg=-lgcc_eh -C link-arg=-lunwind -C link-arg=-Wl,--end-group" >> $GITHUB_ENV

      - id: build-app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          args: --verbose --features holochain_bundled --target ${{ matrix.target }}

      - name: Upload aarch64 AppImage for Ubuntu Touch job
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: volla-messages-appimage-aarch64
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/Volla Messages_*.AppImage
          retention-days: 1

  release-tauri-app-android:
    permissions: write-all
    environment: Relay Release
    needs:
      - release-tauri-app-linux
      - create-release
    runs-on: [self-hosted, yolo]
    container:
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: 'holochain_service'
            label: lite
          - feature: 'holochain_bundled'
            label: rich
    steps:
      - uses: actions/checkout@v3

      - name: Install packages
        run: |
          apt-get update
          apt-get install -y sudo build-essential curl openjdk-11-jdk unzip git cmake clang libclang-dev

      - name: setup node
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          override: true
          toolchain: 1.89

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-24.05
          enable_kvm: false

      - uses: cachix/cachix-action@v15
        env:
          USER: root
        with:
          name: holochain-ci

      - uses: cachix/cachix-action@v15
        env:
          USER: root
        with:
          name: holochain-open-dev

      - uses: cachix/cachix-action@v15
        env:
          USER: root
        with:
          name: darksoil-studio

      - name: Install and prepare
        run: |
          nix develop --no-update-lock-file --command npm install && npm run setup:happ-release

      - name: setup Android signing
        run: |
          mkdir src-tauri/gen/android
          cd src-tauri/gen/android
          printf '%s' "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > keystore.jks
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=../keystore.jks" >> keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties

      - name: Copy variant tauri config
        run: |
          cp -Rf src-tauri/gen/android-${{ matrix.feature }}/* src-tauri/gen/android/
          cp -f src-tauri/tauri.mobile.${{ matrix.feature }}.conf.json src-tauri/tauri.conf.json

      - name: Build android AAB
        run: |
          cargo clean
          nix develop .#androidDev --no-update-lock-file --command bash -c "npm run tauri:android:build:${{ matrix.feature }} -- --aab --target aarch64 --target x86_64"

      - name: Build android APK (aarch64)
        run: |
          cargo clean
          nix develop .#androidDev --no-update-lock-file --command bash -c "npm run tauri:android:build:${{ matrix.feature }} -- --apk --split-per-abi --target aarch64"

      # - name: Build android APK (i684)
      #   run: |
      #     cargo clean
      #     nix develop .#androidDev --no-update-lock-file --command bash -c "npm run tauri:android:build:${{ matrix.feature }} -- --apk --split-per-abi --target i686"

      - name: Build android APK (x86_64)
        run: |
          cargo clean
          nix develop .#androidDev --no-update-lock-file --command bash -c "npm run tauri:android:build:${{ matrix.feature }} -- --apk --split-per-abi --target x86_64"

      - name: Rename android APKs and ABBs
        run: |
          sudo apt install rename

          # Rename apk to include the feature build label
          find src-tauri/gen/android/app/build/outputs/apk/*/release -type f -name "*.apk" -exec rename -v 's/release\/app/release\/app-${{ matrix.label }}/' {} \;
          find src-tauri/gen/android/app/build/outputs/bundle -type f -name "*.aab" -exec rename -v 's/app-universal-release/app-universal-${{ matrix.label }}-release/' {} \;

      - uses: AButler/upload-release-assets@v3.0
        with:
          files: "src-tauri/gen/android/app/build/outputs/apk/*/release/app-*;src-tauri/gen/android/app/build/outputs/bundle/**/*.aab"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ needs.create-release.outputs.releaseId }}

  release-tauri-app-windows:
    needs: create-release
    permissions: write-all
    environment: Relay Release
    runs-on: self-hosted-win-x64
    steps:
      # Step 1: Install Chocolatey (if not already installed)
      - name: Install Chocolatey
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }

      - name: Install Packages
        shell: powershell
        run: |
          choco install git cmake strawberryperl llvm -y
          C:\ProgramData\chocolatey\tools\shimgen.exe -p="C:\Program Files\CMake\bin\cmake.exe" -o=C:\ProgramData\chocolatey\bin\cmake.exe
          C:\ProgramData\chocolatey\tools\shimgen.exe -p="C:\Program Files\Git\cmd\git.exe" -o=C:\ProgramData\chocolatey\bin\git.exe
          C:\ProgramData\chocolatey\tools\shimgen.exe -p="C:\Strawberry\perl\bin\perl.exe" -o=C:\ProgramData\chocolatey\bin\perl.exe

      - run: git config --system core.longpaths true

      - uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: install Rust stable
        uses: lionel-faber/toolchain@038230242ab440f3b34fc2fbd7ae4111add9e690
        with:
          override: true
          toolchain: 1.89

      - name: install Go stable
        uses: actions/setup-go@v4
        with:
          go-version: "stable"

      - name: Install and prepare
        run: |
          npm install
          npm run setup:happ-release

      - name: Copy variant tauri config
        run: |
          Copy-Item -Path src-tauri\tauri.desktop.conf.json -Destination src-tauri\tauri.conf.json

      - name: Build the App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --features holochain_bundled

      - name: Sign the App
        if: false
        run: |

          # Powershell settings to make the script exit on error
          # If the github env variable IGNORE_WINDOWS_CODESIGNING_ERROR is "true",
          # then any errors in this script will not be fatal to the job.
          $IGNORE_WINDOWS_CODESIGNING_ERROR = "${{ vars.IGNORE_WINDOWS_CODESIGNING_ERROR }}"
          if ( "true" -ne $IGNORE_WINDOWS_CODESIGNING_ERROR )
          {
            $ErrorActionPreference = "Stop"
            Set-StrictMode -Version Latest
            $PSNativeCommandUseErrorActionPreference = $true
          }

          # read name and version from tauri.conf.json
          $TAURI_CONF = (Get-Content src-tauri\tauri.conf.json | Out-String | ConvertFrom-Json)
          $APP_PRODUCT_NAME_VERSION = "$($TAURI_CONF.productName)_$($TAURI_CONF.version)"

          $BUNDLE_OUT_PATH_1 = "C:\actions-runner\_work\${{ github.event.repository.name }}\${{ github.event.repository.name }}\target\release\bundle\nsis\$($APP_PRODUCT_NAME_VERSION)_x64-setup.exe"
          $BUNDLE_OUT_PATH_2 = "C:\actions-runner\_work\${{ github.event.repository.name }}\${{ github.event.repository.name }}\target\release\bundle\msi\$($APP_PRODUCT_NAME_VERSION)_x64_en-US.msi"

          # log hashes before code signing
          CertUtil -hashfile $BUNDLE_OUT_PATH_1 SHA256
          CertUtil -hashfile $BUNDLE_OUT_PATH_2 SHA256

          # Code sign the output bundles via azure key vault, following these instructions:
          # https://melatonin.dev/blog/how-to-code-sign-windows-installers-with-an-ev-cert-on-github-actions/
          dotnet tool install --global AzureSignTool
          AzureSignTool sign -kvu "${{ secrets.AZURE_KEY_VAULT_URI }}" -kvi "${{ secrets.AZURE_CLIENT_ID }}" -kvt "${{ secrets.AZURE_TENANT_ID }}" -kvs "${{ secrets.AZURE_CLIENT_SECRET }}" -kvc ${{ secrets.AZURE_CERT_NAME }} -tr http://timestamp.digicert.com -v $BUNDLE_OUT_PATH_1
          AzureSignTool sign -kvu "${{ secrets.AZURE_KEY_VAULT_URI }}" -kvi "${{ secrets.AZURE_CLIENT_ID }}" -kvt "${{ secrets.AZURE_TENANT_ID }}" -kvs "${{ secrets.AZURE_CLIENT_SECRET }}" -kvc ${{ secrets.AZURE_CERT_NAME }} -tr http://timestamp.digicert.com -v $BUNDLE_OUT_PATH_2

          # log hashes after code signing
          CertUtil -hashfile $BUNDLE_OUT_PATH_1 SHA256
          CertUtil -hashfile $BUNDLE_OUT_PATH_2 SHA256

      - name: Upload the Signed App
        uses: AButler/upload-release-assets@v3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ needs.create-release.outputs.releaseId }}
          # We use forward slashes for glob expressions, even though these are windows paths.
          # See the docs for the fast-glob library used by this gh action:
          # https://www.npmjs.com/package/fast-glob#how-to-write-patterns-on-windows
          files: C:/actions-runner/_work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/src-tauri/target/release/bundle/msi/*;C:/actions-runner/_work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/src-tauri/target/release/bundle/nsis/*

  release-tauri-app-macos:
    needs: create-release
    permissions: write-all
    environment: Relay Release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          override: true
          toolchain: 1.89

      - name: install Go stable
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Install and prepare
        run: |
          npm install
          npm run setup:happ-release

      - name: Copy variant tauri config
        run: |
          cp -f src-tauri/tauri.desktop.conf.json src-tauri/tauri.conf.json
          ls -la
          ls -la src-tauri

      - name: Build the App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          args: --verbose --features holochain_bundled

  release-tauri-app-ubuntu-touch:
    name: Build Ubuntu Touch click
    needs: [create-release, release-tauri-app-linux]
    permissions: write-all
    environment: Relay Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            qemu-user-static \
            wget \
            dpkg-dev \
            gtk-doc-tools \
            libtool \
            pipx
          pipx install clickable-ut

      - name: Stamp version into source files
        working-directory: ut
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" build.sh

      - name: Download aarch64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: volla-messages-appimage-aarch64
          path: ut/

      - name: Make build dir and move the AppImage there
        working-directory: ut
        run: |
          mkdir -p build/aarch64-linux-gnu/app
          mv Volla\ Messages_*.AppImage \
            build/aarch64-linux-gnu/app/Volla.Messages_${{ steps.version.outputs.version }}_aarch64.AppImage

      - name: Build click package
        working-directory: ut
        run: |
          clickable build --arch arm64 --skip-review

      - name: Upload click to release
        uses: AButler/upload-release-assets@v3.0
        with:
          files: "ut/build/aarch64-linux-gnu/app/*.click"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ needs.create-release.outputs.releaseId }}