[toolchain]
# holochain 0.7.0 needs a recent compiler (holochain_zome_types 0.7 uses
# str::floor_char_boundary); 1.95.0 matches android-service-runtime. The
# release workflows and the nix dev shell (rust-overlay) both derive their
# rust from this file, so nix, rustup, and CI users all build with the same
# compiler.
channel = "1.95.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
targets = [
  # zome wasm (npm run build:zomes)
  "wasm32-unknown-unknown",
  # android (npm run tauri:android:build:*)
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
